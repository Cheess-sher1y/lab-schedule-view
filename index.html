  const response = await fetch("/api/" + route, options);
  const result = await response.json();
  if (!response.ok) {
    const error = new Error(result.error || "请求失败");
    error.status = response.status;
    throw error;
  }
  return result;
}

function notice(message) {
  toast.textContent = message;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.textContent = ""; }, 3300);
}

async function refresh() {
  const sequence = ++stateRequest;
  const value = await request("state");
  if (sequence < appliedStateRequest) return;
  appliedStateRequest = sequence;
  const key = JSON.stringify(value);
  state = value;
  if (!selected) selected = state.today;
  if (!month) month = selected.slice(0, 7);
  if (key !== snapshot) {
    snapshot = key;
    if (projectFilter && !project(projectFilter)) {
      projectFilter = 0;
      if (view === "project") view = "projects";
      if (modal.open) modal.close();
    }
    render();
  }
}

function entryList(key, pid) {
  const result = [];
  for (const item of active()) {
    if (pid && item.id !== pid) continue;
    for (const t of activeTasks(item)) {
      const current = phase(t);
      for (const h of t.phases) {
        const actions = h.actions.filter(a => a.kind !== "correct" && !a.void);
        for (const action of actions) {
          if ((action.kind === "complete" && (action.result === key || action.due === key)) ||
              (action.kind !== "complete" && action.due === key)) {
            result.push({ title: t.name, status: states[action.kind], type: action.kind === "delay" ? "" : "done",
              detail: action.kind === "delay" ? "改至 " + action.result :
                action.kind === "complete" && action.result !== key ? "实际完成 " + action.result : action.username,
              project: item.name, action: "task-detail", id: t.id, phase: h.id });
          }
        }
        if (!h.due || h.closed || h.id !== current.id || key >= h.ends) continue;
        const overdue = h.due < state.today && state.today < h.ends;
        if (key === h.due || (overdue && key === state.today)) {
          result.push({ title: t.name, status: overdue ? "逾期" : "待办", type: overdue ? "overdue" : "",
            detail: overdue ? "原计划 " + h.due : "", project: item.name, action: "task-detail", id: t.id, phase: h.id });
        } else if (key > h.due && key > state.today && (dayDate(key) - dayDate(h.due)) / 86400000 % h.period === 0) {
          result.push({ title: t.name, status: "计划", type: "", project: item.name,
            action: "task-detail", id: t.id, phase: h.id });
        }
      }
    }
  }
  for (const item of state.events) {
    if (item.day !== key || (pid && item.project !== pid) ||
      (item.phase && task(item.task)?.archived)) continue;
    result.push({ title: trim(item.content), status: item.mark, type: item.phase ? "end" : "event",
      project: project(item.project)?.name, action: item.phase ? "task-detail" : "event-detail",
      id: item.phase ? item.task : item.id, phase: item.phase });
  }
  return result;
}

function calendar() {
  const anchor = month + "-01";
  const offset = (dayDate(anchor).getUTCDay() + 6) % 7;
  const start = plus(anchor, -offset);
  const label = month.replace(/^(.{4})-(\d{2})$/, (_, year, number) => year + " 年 " + Number(number) + " 月");
  const days = Array.from({ length: 42 }, (_, i) => {
    const key = plus(start, i);
    const entries = entryList(key, projectFilter);
    const className = "cal-day" + (key.slice(0, 7) === month ? "" : " outside") +
      (key === selected ? " selected" : "") + (key === state.today ? " today" : "");
    return '<button type="button" class="' + className + '" data-action="day" data-day="' + key +
      '" aria-label="' + esc(displayDate(key) + "，" + entries.length + " 项") + '" aria-pressed="' + (key === selected) +
      '"><span class="date-num">' + Number(key.slice(-2)) + '</span>' +
      entries.slice(0, 2).map(entry => '<span class="cal-entry ' + entry.type + '">' + esc(entry.title) + '</span>').join("") +
      (entries.length > 2 ? '<span class="cal-more">+' + (entries.length - 2) + '</span>' : "") + '</button>';
  }).join("");
  const entries = entryList(selected, projectFilter);
  const controls = publicView ? "" : button("新建实验项目", "new-project") +
    button("＋ 新建任务", "new-task", { project: projectFilter }, "primary");
  return heading(names.calendar, "查看当天的培养待办、阶段提醒与实验记录。", controls) +
    '<div class="calendar-layout"><section class="calendar card"><div class="cal-toolbar row between">' +
    '<h2>' + label + '</h2><div class="row">' +
    button("‹", "month", { step: -1 }, "icon") + button(publicView ? "发布日期" : "今天", "today") +
    button("›", "month", { step: 1 }, "icon") + '</div>' +
    '<div class="row">' + select("filter", option("全部实验", 0, projectFilter) +
      active().map(item => option(item.name, item.id, projectFilter)).join(""), 'aria-label="筛选实验项目"') +
    '</div></div><div class="cal-grid">' + ["一", "二", "三", "四", "五", "六", "日"]
      .map(day => '<div class="weekday">' + day + '</div>').join("") + days + '</div></section>' +
    '<section class="card day-panel"><span class="eyebrow">' +
    (selected === state.today ? (publicView ? "发布日期" : "今日") : "所选日期") +
    '</span><h2>' + esc(displayDate(selected)) + '</h2><div class="day-tools">' +
    '<span class="day-count">' + entries.length + ' 条安排</span>' +
    (publicView ? "" : button("＋ 添加事件", "new-event", { day: selected, project: projectFilter })) + '</div>' +
    '<div class="day-list">' + (entries.length ? entries.map(entry => '<button type="button" class="entry" data-action="' +
      entry.action + '" data-id="' + entry.id + '" data-phase="' + (entry.phase || "") + '">' +
      pill(entry.status, entry.type) + '<strong>' + esc(entry.title) + '</strong><small>' + esc(entry.project) +
      (entry.detail ? " · " + esc(entry.detail) : "") + '</small></button>').join("") :
      empty(publicView || active().length ? "这一天还没有安排。" : "先创建一个实验项目，再添加培养任务或事件。")) + '</div></section></div>';
}

async function exportPublicPage(form) {
  const fields = new FormData(form);
  const selection = { projects: fields.getAll("projects").map(Number), photos: fields.getAll("photos").map(Number) };
  if (localExport) {
    await request("export/local", selection);
    state.local_export = selection;
    modal.close();
    notice("已覆盖 GitHub发布/index.html");
    return;
  }
  const response = await fetch("/api/export", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(selection),
  });
  if (!response.ok) throw new Error((await response.json()).error || "导出失败");
  const url = URL.createObjectURL(await response.blob());
  const link = document.createElement("a");
  link.href = url;
  link.download = "index.html";
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
  notice("公开版已下载");
}

function taskOptions(pid, current) {
  return option("无关联", "", current) + (project(pid)?.tasks || []).filter(t => !t.archived || t.id === Number(current))
    .map(t => option(t.name, t.id, current)).join("");
}

function files(item, edit = false) {
  if (publicView) return (item?.files || []).map(file =>
    '<figure class="published-photo"><img loading="lazy" src="' + esc(file.url) + '" alt="' + esc(file.name) +
    '"><figcaption>' + esc(file.name) + '</figcaption></figure>').join("");
  return (item?.files || []).map(f => '<div class="row"><a href="/api/file/' + f.id + '">' +
    esc(f.name) + '</a><small>' + (f.role === "protocol" ? "操作规程" : "图片") + '</small>' +
    (edit ? '<label class="check"><input type="checkbox" name="removed" value="' + f.id + '">移除</label>' : "") + '</div>').join("");
}

function phaseInputs(p, fallback) {
  return '<div class="fields">' + field("开始日期", input("start", p?.start || fallback, "date")) +
    field("周期天数", input("period", p?.period || 2, "number", 'required min="1" step="1"')) +
    field("阶段时长（天）", input("length", p?.length || 14, "number", 'required min="1" step="1"')) + '</div>';
}

function tagsField(value) {
  const items = [...tasks(), ...state.events].flatMap(item => (item.tags || "").split(",")).filter(Boolean);
  const unique = [...new Set(items)];
  return field("标签（用逗号分隔）", input("tags", value, "text", 'list="known-tags" maxlength="620"') +
    '<datalist id="known-tags">' + unique.map(tag => option(tag, tag, "")).join("") + '</datalist>');
}

function editTask(item, pid) {
  const chosen = item?.project || Number(pid) || active()[0]?.id || "new";
  show(item ? "编辑周期任务" : "新建周期任务", form("task",
    input("id", item?.id || "", "hidden", "") + field("任务名称", input("name", item?.name || "", "text", 'required maxlength="200"')) +
    projectFields(chosen) + field("负责人（选填）", select("owner", projectMembers(chosen, item?.owner || ""))) +
    phaseInputs(item && phase(item), state.today) + tagsField(item?.tags || "") +
    field("培养照片（选填）", input("photo", "", "file", 'multiple accept="image/*,.tif,.tiff,.heic,.heif,.dng"')) +
    field("操作规程（选填）", input("protocol", "", "file", "multiple")) + files(item, true)));
  updateProjectFields(modal.querySelector("form"));
}

function editEvent(item, pid, day) {
  const chosen = item?.project || Number(pid) || active()[0]?.id || "new";
  show(item ? "编辑事件" : "新建事件", form("event", input("id", item?.id || "", "hidden", "") +
    field("事件内容", '<textarea name="content" required maxlength="3000">' + esc(item?.content || "") + '</textarea>') +
    projectFields(chosen) + '<div class="fields">' + field("发生日期", input("day", item?.day || day || selected, "date")) +
    field("日历标记", select("mark", option("选择标记", "", item?.mark || "") + markers.map(label => option(label, label, item?.mark)).join(""), "required")) + '</div>' +
    field("关联周期任务（选填）", select("task", taskOptions(chosen, item?.task || ""))) + tagsField(item?.tags || "") +
    field("事件照片（选填）", input("photo", "", "file", 'multiple accept="image/*,.tif,.tiff,.heic,.heif,.dng"')) +
    files(item, true) + '<label class="check"><input type="checkbox" name="email"' +
    (item?.email ? " checked" : "") + '>加入邮件提醒</label>'));
  updateProjectFields(modal.querySelector("form"));
}

function updateProjectFields(form) {
  const choice = form.elements.project.value;
  form.querySelector("[data-new-project]").hidden = choice !== "new";
  form.elements.newProject.required = choice === "new";
  if (form.elements.owner) form.elements.owner.innerHTML = projectMembers(choice, form.elements.owner.value);
  if (form.elements.task) form.elements.task.innerHTML = taskOptions(choice, form.elements.task.value);
}

function delayRange(phase) {
  const dayAfterDue = plus(phase.due, 1);
  return { min: dayAfterDue < state.today ? state.today : dayAfterDue, max: plus(phase.ends, -1) };
}

function detailTask(item, wanted) {
  if (!item) return notice("找不到该周期任务或你没有访问权限");
  const current = phase(item);
  const h = item.phases.find(value => value.id === Number(wanted)) || current;
  const archived = Boolean(item.archived || project(item.project).archived);
  const due = h.due;
  const canAct = !publicView && !archived && due && due <= state.today;
  const ended = h.ends <= state.today;
  const delay = canAct && !ended && !h.closed ? delayRange(h) : null;
  const row = !publicView && h.id === current.id && !h.closed && ended && !archived;
  const taskData = { id: item.id, phase: h.id };
  const actions = h.actions;
  const attachments = files(item);
  show(item.name, '<div class="row between"><p class="muted">' + esc(project(item.project).name) +
    (publicView ? "" : ' · 负责人 ' + esc(item.owner_name || "未设置")) + '</p>' + tagList(item.tags) + '</div>' +
    (archived ? '<p>' + pill("已归档") + ' 预计清理 ' + esc(item.purge || project(item.project).purge) + '</p>' : "") +
    (attachments ? '<div class="stack">' + attachments + '</div>' : "") +
    '<div class="row">' + item.phases.map((value, i) => button("阶段 " + (i + 1), "task-detail", {
      id: item.id, phase: value.id,
    }, value.id === h.id ? "primary" : "")).join("") + '</div><div class="history">' +
    '<h3>培养阶段</h3><p>开始 ' + h.start + ' · 每 ' + h.period + ' 天 · 共 ' + h.length + ' 天</p>' +
    '<p>阶段结束 ' + h.ends + (h.closed ? " · 已处理" : ended ? " · 待确认" : "") + '</p>' +
    (due ? '<p>' + (h.closed || ended ? "历史待办 " : "下一次待办 ") + due +
      (due < state.today && !ended ? " · 逾期" : "") + '</p>' : "") + '</div>' +
    (canAct ? '<div class="row">' + button("标记已完成", "action", { ...taskData, kind: "complete" }, "primary") +
      (delay && delay.min <= delay.max ? button("延期", "action", { ...taskData, kind: "delay" }) : "") +
      button("跳过", "action", { ...taskData, kind: "skip" }) + '</div>' : "") +
    (delay && delay.min > delay.max ? '<p class="muted">本阶段于 ' + h.ends +
      ' 结束，阶段结束前已没有可延期的日期。如需安排更晚的操作，请先编辑阶段时长。</p>' : "") +
    (row ? '<div class="row">' + button("进入下一阶段", "next-phase", taskData, "primary") +
      button("完全结束", "finish-phase", taskData, "danger") + '</div>' : "") +
    '<div class="history"><h3>操作记录</h3>' + (actions.length ? actions.map(a => '<p>' +
      esc((states[a.kind] || a.kind) + (a.void ? "（已更正）" : "") +
        (publicView ? "" : " · " + a.username) + " · " + timestamp(a.at) +
        (a.kind === "delay" ? " · 改至 " + a.result : "")) + '</p>').join("") : '<p class="muted">暂无操作。</p>') +
    (!publicView && !archived && actions.some(a => !a.void && a.kind !== "correct") ?
      button("更正最近一次操作", "action", { ...taskData, kind: "correct" }, "link") : "") + '</div>' +
    (publicView ? "" : '<div class="row">' + (archived ? item.archived && !project(item.project).archived ?
      button("恢复任务", "restore-task", { id: item.id }, "primary") : "" :
      button("编辑任务", "edit-task", { id: item.id }) + button("归档任务", "archive-task", { id: item.id }, "danger")) + '</div>'));
}

function detailEvent(item) {
  if (!item) return notice("找不到该事件或你没有访问权限");
  show("事件详情", '<p class="muted">' + esc(project(item.project).name + " · " + item.day +
    (publicView ? "" : " · " + item.username)) +
    '</p><div class="row">' + pill(item.mark, "event") + tagList(item.tags) +
    (item.email ? pill("邮件提醒") : "") + '</div><p>' + esc(item.content) + '</p>' +
    (item.task ? '<p>关联任务 ' + esc(task(item.task)?.name || "") + '</p>' : "") +
    files(item) + (publicView ? "" : '<div class="row">' + button("编辑事件", "edit-event", { id: item.id }) +
    button("删除事件", "delete-event", { id: item.id }, "danger") + '</div>'));
}

function actionDialog(item, phaseId, kind) {
  const h = item.phases.find(value => value.id === Number(phaseId));
  const label = kind === "delay" ? "延期待办" : states[kind];
  const actual = kind === "complete";
  let dateField = actual ? field("实际完成日期", input("date", state.today, "date")) : "";
  if (kind === "delay") {
    const { min, max } = delayRange(h);
    if (min > max) return detailTask(item, phaseId);
    dateField = field("延期至", input("date", min, "date", 'required min="' + min + '" max="' + max + '"') +
      '<small>可选日期 ' + min + (min === max ? '' : ' 至 ' + max) + '。阶段结束日为 ' + h.ends + '。</small>');
  }
  const timeField = actual ? field("实际完成时间（北京时间，选填）", input("time", "", "time", "")) : "";
  show(label, '<p>' + esc(item.name + " · " + (h.due || h.ends)) + '</p>' + form("task/action",
    input("task", item.id, "hidden", "") + input("phase", h.id, "hidden", "") + input("kind", kind, "hidden", "") +
    input("due", h.due || "", "hidden", "") + input("version", h.actions[0]?.id || 0, "hidden", "") +
    dateField + timeField, "确认"));
}

const modalActions = {
  export: exportDialog,
  "new-project": () => show("新建实验项目", form("project/create",
    field("实验项目名称", input("name", "", "text", 'required maxlength="200"')), "创建")),
  "rename": ({ id }) => show("重命名实验项目", form("project/rename",
    input("id", id, "hidden", "") + field("名称", input("name", project(id).name, "text", 'required maxlength="200"')))),
  "archive-project": ({ id }) => confirmForm("解散实验项目",
    "成员将失去访问权限，实验内容保留六个月。恢复后由组长重新添加成员。",
    "project/archive", { id }),
  "restore-project": ({ id }) => confirmForm("恢复实验项目", "恢复内容后，你可以重新添加工作组成员。",
    "project/restore", { id }),
  "share": ({ id }) => {
    const group = (state.group?.members || []).filter(u => !project(id).members.some(m => m.id === u.id));
    show("分享实验项目", '<p class="muted">工作组成员可以查看并编辑这个实验。</p>' +
      (group.length ? '<div class="stack"><h3>从课题组选人</h3>' + group.map(u => listItem(u.name, "同组成员",
        button("分享给此成员", "share-group", { id, name: u.name }))).join("") + '</div><hr class="hr">' : "") +
      form("project/share", input("id", id, "hidden", "") +
        field("按用户名分享", input("name", "", "text", 'required maxlength="40"')), "分享"));
  },
  "share-group": ({ id, name }) => confirmForm("分享实验项目", "分享给 " + name + "。", "project/share", { id, name }),
  "remove-member": ({ id, user }) => confirmForm("移除成员", "该成员将失去这个实验的访问权限。", "project/remove", { id, user }),
  "group-leave": () => confirmForm("退出课题组", "已有的实验工作组访问权限仍然有效。", "group", { mode: "leave" }),
  "group-create": () => show("新建课题组", form("group", input("mode", "create", "hidden", "") +
    field("课题组名称", input("name", state.user.group_name, "text", 'required maxlength="100"')), "创建并加入")),
  "group-join": () => show("加入课题组", form("group", input("mode", "join", "hidden", "") +
    field("组码", input("code", invite, "text", 'required maxlength="30"')), "加入")),
  "new-task": ({ project }) => editTask(null, project),
  "edit-task": ({ id }) => editTask(task(id)),
  "task-detail": ({ id, phase }) => detailTask(task(id), phase),
  "new-event": ({ project, day }) => editEvent(null, project, day),
  "edit-event": ({ id }) => editEvent(event(id)),
  "event-detail": ({ id }) => detailEvent(event(id)),
  "delete-event": ({ id }) => confirmForm("删除事件", "删除后无法恢复。", "event", { id, delete: "true" }),
  "action": ({ id, phase, kind }) => actionDialog(task(id), phase, kind),
  "next-phase": ({ id, phase }) => show("进入下一阶段", form("task/phase",
    input("task", id, "hidden", "") + input("phase", phase, "hidden", "") + input("choice", "next", "hidden", "") +
    phaseInputs(null, state.today), "开启下一阶段")),
  "finish-phase": ({ id, phase }) => confirmForm("完全结束", "整条任务将归档六个月，历史记录一并保留。", "task/phase",
    { task: id, phase, choice: "finish" }),
  "archive-task": ({ id }) => confirmForm("归档任务", "立即停止未来提醒，六个月内可以恢复。", "task/archive", { id }),
  "restore-task": ({ id }) => {
    const item = task(id);
    const h = phase(item);
    if (h.ends <= state.today) return confirmForm("恢复任务", "原阶段已结束。恢复后可处理阶段结束事件。",
      "task/archive", { id, restore: "true" });
    show("恢复任务", '<p>原阶段结束日 ' + h.ends + ' · 每 ' + h.period + ' 天一次</p>' +
      form("task/archive", input("id", id, "hidden", "") + input("restore", "true", "hidden", "") +
        field("从哪天继续", input("resume", state.today, "date", 'required min="' + state.today + '"')), "恢复"));
  },
};

document.addEventListener("click", async event => {
  const control = event.target.closest("[data-action]");
  if (!control) return;
  const d = control.dataset;
  if (publicView && !["close", "nav", "project", "project-calendar", "day", "today", "month",
    "task-detail", "event-detail"].includes(d.action)) return;
  if (d.action === "auth") { authView = d.target; authNotice = ""; authRender(); return; }
  if (d.action === "close") { modal.close(); return; }
  if (!state) return;
  try {
    if (d.action in modalActions) { modalActions[d.action](d); return; }
    if (d.action === "nav") { view = d.view; projectFilter = 0; }
    if (d.action === "project" || d.action === "project-calendar") {
      view = d.action === "project" ? "project" : "calendar";
      projectFilter = Number(d.id);
    }
    if (d.action === "day") selected = d.day;
    if (d.action === "today") { selected = state.today; month = selected.slice(0, 7); }
    if (d.action === "month") {
      const date = dayDate(month + "-01");
      date.setUTCMonth(date.getUTCMonth() + Number(d.step));
      month = iso(date).slice(0, 7);
      selected = month + "-01";
    }
    if (d.action === "logout") {
      await request("auth/logout", {});
      appliedStateRequest = ++stateRequest;
      state = snapshot = selected = month = null;
      view = "calendar"; projectFilter = 0; authView = "login"; authNotice = "";
    }
    render();
  } catch (error) {
    notice(error.message);
  }
});

document.addEventListener("change", event => {
  const element = event.target;
  if (element.name === "filter") { projectFilter = Number(element.value); render(); }
  if (element.name === "project" && element.form) updateProjectFields(element.form);
});

function readFile(file, role) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve({ name: file.name, role, data: reader.result.split(",")[1] });
    reader.onerror = () => reject(new Error("无法读取附件"));
    reader.readAsDataURL(file);
  });
}

async function payload(form) {
  const fields = new FormData(form);
  const result = {};
  for (const [key, value] of fields) {
    if (!(value instanceof File) && key !== "removed") result[key] = value;
  }
  for (const key of ["id", "project", "task", "owner", "phase", "user", "version"]) {
    if (key in result && result[key] !== "new") result[key] = result[key] === "" ? null : Number(result[key]);
  }
  for (const key of ["subscribed", "delete", "restore"]) {
    if (key in result) result[key] = Boolean(result[key]);
  }
  if (form.dataset.route === "event") result.email = fields.has("email");
  if (form.dataset.route === "task" || form.dataset.route === "event") {
    const raw = ["photo", "protocol"].flatMap(role =>
      fields.getAll(role).filter(file => file instanceof File && file.name).map(file => ({ file, role })));
    if (raw.some(({ file }) => file.size > 10 * 1024 * 1024) || raw.reduce((n, item) => n + item.file.size, 0) > 20 * 1024 * 1024)
      throw new Error("单个附件最多 10 MB，本次上传合计最多 20 MB。");
    result.files = await Promise.all(raw.map(({ file, role }) => readFile(file, role)));
    result.removed = fields.getAll("removed").map(Number);
  }
  return result;
}

document.addEventListener("submit", async event => {
  const form = event.target.closest("form[data-route]");
  if (!form) return;
  event.preventDefault();
  if (publicView) return;
  const route = form.dataset.route;
  const errorBox = form.querySelector(".form-error");
  const save = form.querySelector("[type=submit]");
  save.disabled = true;
  errorBox.textContent = "";
  try {
    if (route === "export") {
      await exportPublicPage(form);
      return;
    }
    const data = await payload(form);
    const result = await request(route, data);
    if (route.startsWith("auth/")) {
      if (route === "auth/login") {
        await refresh();
        openDeepLink();
      } else {
        authNotice = result.message;
        authView = "login";
        render();
      }
      return;
    }
    if (modal.open) modal.close();
    if (route === "group") {
      invite = "";
      sessionStorage.removeItem("lab-invite");
    }
    if (route === "project/create") { view = "project"; projectFilter = result.id; }
    if (route === "project/archive") { view = "archive"; projectFilter = 0; }
    await refresh();
    if (route === "task/action" || (route === "task/phase" && data.choice === "next"))
      detailTask(task(data.task), route === "task/action" ? data.phase : 0);
    else if (route === "task") detailTask(task(result.id));
    else if (route === "event" && result.id) detailEvent(event(result.id));
    notice("已保存");
  } catch (error) {
    if (error.status === 409 && state) {
      await refresh().catch(() => {});
      if (route === "task/action" && modal.open) {
        const id = Number(form.elements.task?.value);
        if (task(id)) detailTask(task(id), Number(form.elements.phase?.value));
      }
      notice(error.message);
    } else {
      errorBox.textContent = error.message;
      if (!form.isConnected) notice(error.message);
    }
  } finally {
    save.disabled = false;
  }
});

function openDeepLink() {
  if (openExport) {
    openExport = false;
    exportDialog();
  }
  if (deep.task) { detailTask(task(deep.task)); deep.task = 0; }
  if (deep.event) { detailEvent(event(deep.event)); deep.event = 0; }
  if (invite) { view = "group"; render(); modalActions["group-join"](); }
}

async function start() {
  if (publicView) {
    state = JSON.parse(document.querySelector("#public-data").textContent);
    selected = state.today;
    month = selected.slice(0, 7);
    render();
    openDeepLink();
    return;
  }
  if (authLink) { authRender(); return; }
  try {
    await refresh();
    openDeepLink();
  } catch (error) {
    if (error.status === 401) authRender();
    else app.textContent = "无法连接实验日程，请刷新页面重试。";
  }
}

start();
if (!publicView) setInterval(() => {
  if (!state || document.hidden) return;
  refresh().catch(error => {
    if (error.status === 401) {
      state = snapshot = null;
      if (modal.open) modal.close();
      authView = "login";
      authNotice = "登录已过期，请重新登录。";
      render();
    }
  });
}, 3000);
</script>
</body>
</html>
